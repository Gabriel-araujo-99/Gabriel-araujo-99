name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Gabriel-araujo-99
          outputs: |
          dist/github-contribution-grid-snake.svg?palette=github-light&hide_empty=true
          dist/github-contribution-grid-snake-dark.svg?palette=github-dark&hide_empty=true

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
