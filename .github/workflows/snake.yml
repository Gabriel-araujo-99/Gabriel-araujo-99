name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Gabriel-araujo-99
          outputs: |
          dist/github-contribution-grid-snake.svg?color_snake=#ff79c6&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
          dist/github-contribution-grid-snake-dark.svg?color_snake=#50fa7b&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
      
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
